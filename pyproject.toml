[project]
name = "clinsight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anukjose", email = "anukjose6@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "guardrails-ai>=0.1.8",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "lxml>=6.1.3",
    "mcp[cli]<2",
    "openai>=3.10.0",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
clinsight = "clinsight:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
